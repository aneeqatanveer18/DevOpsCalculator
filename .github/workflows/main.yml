name: Calculator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Check JavaScript syntax
        run: |
          node --check script.js

      - name: Check calculator features
        run: |
          grep -q "Simple Calculator" index.html
          grep -q "percentage" index.html
          grep -q "calculationHistory" script.js

      - name: CI successful
        run: echo "Calculator CI checks completed successfully."
